<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="100%" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chart-title">Single-stream download: RTT ≈ 0 vs 50 ms</title>
