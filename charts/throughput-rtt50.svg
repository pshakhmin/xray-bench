<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="100%" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chart-title">Single-stream download: RTT ≈ 0 vs 50 ms</title>
<desc id="chart-desc">Single-stream download throughput in MB/s at RTT close to zero and at 50 ms of emulated RTT. Xray falls from 360.6 to 88.6, sing-box from 5310 to 103.6, Unbihex 0.2.2 + PR #18 from 430.3 to 85.8 MB/s. Unbihex 0.2.2 (stock) collapses from 437.5 to 5.8 MB/s, a 75 times drop, while the other three engines stay between 85.8 and 103.6 MB/s.</desc>
<text x="32" y="38" font-size="19" fill="#747987" font-weight="650">Single-stream download: RTT ≈ 0 vs 50 ms</text>
<text x="32" y="58" font-size="11.5" fill="#747987">↓1 median MB/s (MiB/s) · higher is better</text>
<text x="56" y="95" font-size="10" fill="#747987" text-anchor="end" font-weight="500">MB/s</text>
