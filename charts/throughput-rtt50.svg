<text x="32" y="424" font-size="10" fill="#747987">At 8 streams and 50 ms, netem itself is the bottleneck, so only ↓1 is compared at 50 ms.</text>
<text x="32" y="440" font-size="10" fill="#747987">MB/s = MiB/s as reported by the bench · medians over the recorded runs.</text>
