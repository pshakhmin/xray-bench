<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chart-title">Пропускная способность при RTT ≈ 0</title>
<desc id="chart-desc">Сгруппированная столбчатая диаграмма медианной пропускной способности в MB/s при RTT, близком к нулю, для Xray 26.10.29, sing-box 1.14.4 и Unbihex 0.2.5. Для каждого движка показаны скачивание одним потоком, скачивание восемью потоками и отдача одним потоком. Unbihex 0.2.5 лидирует по всем трём метрикам (328.7, 1092.0 и 318.5 MB/s); Xray показывает 254.5, 614.8 и 240.5 MB/s.</desc>
