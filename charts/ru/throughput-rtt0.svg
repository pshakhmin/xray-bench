<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chart-title">Пропускная способность при RTT ≈ 0</title>
<desc id="chart-desc">Сгруппированная столбчатая диаграмма медианной пропускной способности в MB/s при RTT, близком к нулю, для Xray 26.10.29, sing-box 1.14.4 и Unbihex 0.2.2. Для каждого движка показаны скачивание одним потоком, скачивание восемью потоками и отдача одним потоком. sing-box 1.14.4 лидирует по всем трём метрикам (539.8, 1306.4 и 529.7 MB/s); Unbihex 0.2.2 показывает 437.5, 1011.0 и 386.0 MB/s.</desc>
