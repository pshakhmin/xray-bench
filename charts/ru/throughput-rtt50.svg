<text x="32" y="424" font-size="10" fill="#747987">При 8 потоках и 50 мс узкое место — сам netem, поэтому при 50 мс сравнивается только ↓1.</text>
<text x="32" y="440" font-size="10" fill="#747987">MB/s по данным стенда · медианы по записанным прогонам.</text>
</svg>
