<text x="56" y="235.4" font-size="10" fill="#747987" text-anchor="end">300</text>
<line x1="64" y1="189.33" x2="848" y2="189.33" stroke="#8a94a4" stroke-width="1" stroke-opacity="0.3"/>
<text x="56" y="192.73" font-size="10" fill="#747987" text-anchor="end">400</text>
