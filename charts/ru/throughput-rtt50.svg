<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 456" width="100%" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chart-title">Один поток, скачивание: RTT ≈ 0 и 50 мс</title>
<desc id="chart-desc">Пропускная способность скачивания одним потоком в MB/s при RTT, близком к нулю, и при эмулируемых 50 мс RTT. Xray падает с 360.6 до 88.6, sing-box — с 539.8 до 103.6 MB/s. Unbihex 0.2.2 обрушивается с 437.5 до 5.8 MB/s, падение в 75 раз, тогда как Xray и sing-box держатся на 88.6 и 103.6 MB/s.</desc>
<text x="32" y="38" font-size="19" fill="#747987" font-weight="650">Один поток, скачивание: RTT ≈ 0 и 50 мс</text>
<text x="32" y="58" font-size="11.5" fill="#747987">↓1 медиана MB/s · больше — лучше</text>
<text x="56" y="95" font-size="10" fill="#747987" text-anchor="end" font-weight="500">MB/s</text>
