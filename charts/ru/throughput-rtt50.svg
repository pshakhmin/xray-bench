<text x="162.67" y="200.14" font-size="10" fill="#747987" text-anchor="middle" font-weight="600">360.6</text>
<rect x="200.67" y="322.2" width="52" height="37.8" rx="3" fill="#73aebf" stroke="#0e7490" stroke-width="1.2"/>
