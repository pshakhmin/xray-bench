<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="100%" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chart-title">Задержка и темп соединений при RTT ≈ 0</title>
<desc id="chart-desc">Две панели при RTT, близком к нулю. Слева: время до первого байта в мс, столбик медианы и ус p95, меньше — лучше. Справа: соединений в секунду, больше — лучше. У Unbihex 0.2.2 самый высокий p95 — 11.59 мс, и самый низкий темп соединений — 275.8 conn/s. Xray: медиана 3.95 мс, p95 4.97 мс, 448 conn/s. sing-box: медиана 3.34 мс, p95 4.03 мс, 563 conn/s. Unbihex 0.2.2: медиана 5.57 мс.</desc>
