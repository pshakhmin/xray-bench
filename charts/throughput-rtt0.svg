<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" role="img" aria-labelledby="chart-title chart-desc" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="chart-title">Throughput at RTT ≈ 0</title>
<desc id="chart-desc">Grouped bar chart of median throughput in MB/s at RTT close to zero for Xray 26.10.29, sing-box 1.14.4, Unbihex 0.2.2 (stock) and Unbihex 0.2.2 + PR #18. Each engine shows single-stream download, eight-stream download and single-stream upload. sing-box 1.14.4 leads all three metrics (5310, 1306.4 and 529.7 MB/s). Unbihex stock and PR are the same 0.2.2 build; the PR is ahead of stock on eight-stream download and close to it on single-stream download and upload.</desc>
