<title id="chart-title">Latency and connection rate at RTT ≈ 0</title>
<desc id="chart-desc">Two panels at RTT close to zero. Left: time to first byte in ms, median bar and p95 whisker, lower is better. Right: connections per second, higher is better. Unbihex 0.2.2 has the highest p95 at 11.59 ms and the lowest connection rate at 275.8 conn/s. Xray: 3.95 ms median, 4.97 ms p95, 448 conn/s. sing-box: 3.34 ms median, 4.03 ms p95, 563 conn/s. Unbihex 0.2.2: 5.57 ms median.</desc>
