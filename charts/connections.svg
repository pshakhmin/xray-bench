<title id="chart-title">Latency and connection rate at RTT ≈ 0</title>
<desc id="chart-desc">Two panels at RTT close to zero. Left: time to first byte in ms, median bar and p95 whisker, lower is better. Right: connections per second, higher is better. Unbihex 0.2.5 has the lowest TTFB (1.66 ms median, 1.76 ms p95) and the highest connection rate (2004.8 conn/s). Xray: 3.06 ms median, 3.87 ms p95, 580.2 conn/s. sing-box: 2.97 ms median, 3.69 ms p95, 620.4 conn/s.</desc>
